- name: "Generic API Key"
  regex: "api[_-]?key\\s*[=:]\\s*[\"']?[A-Za-z0-9_+./=-]{20,128}[\"']?"
  severity: "medium"
  entropy_required: false

- name: "Generic Token" 
  regex: "token\\s*[=:]\\s*[\"']?[A-Za-z0-9_+./=-]{20,128}[\"']?"
  severity: "medium"
  entropy_required: false

- name: "Generic Secret"
  regex: "(?:secret|password)\\s*[=:]\\s*[\"']?[A-Za-z0-9_+./=-]{20,128}[\"']?"
  severity: "low"
  entropy_required: false

- name: "Environment Variable"
  regex: "\\b[A-Z_]{3,}\\b\\s*=\\s*[\"'][^\"']{20,}[\"']"
  severity: "low"
  entropy_required: false
